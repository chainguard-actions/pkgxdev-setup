name: cd·vx

on:
  release:
    types:
      - published

concurrency:
  group: cd/vx/${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: fischerscode/tagger@5ca3fa63ce3003fb7183cae547644b29f3b632be # v0
        with:
          prefix: v
      - run: |
          git tag -f latest
          git push origin latest --force
