name: Test basic pkgx setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert pkgx is installed
        run: |
          echo "Checking pkgx is on PATH..."
          if ! command -v pkgx >/dev/null 2>&1; then
            echo "FAIL: pkgx not found on PATH"
            exit 1
          fi
          echo "pkgx found at: $(command -v pkgx)"
          echo "pkgx version: $(pkgx --version 2>&1 || true)"
          echo "PASS"
