name: Test pkgx setup with extra packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: ^2
          +: node@20
      - name: Assert pkgx is installed
        run: |
          echo "Checking pkgx is available..."
          if ! command -v pkgx &>/dev/null; then
            echo "FAIL: pkgx command not found"
            exit 1
          fi
          echo "pkgx version: $(pkgx --version)"
          echo "PASS"
      - name: Assert node is available via pkgx
        run: |
          echo "Checking node is available..."
          if ! command -v node &>/dev/null; then
            echo "FAIL: node command not found after specifying node@20 in +"
            exit 1
          fi
          echo "node version: $(node --version)"
          echo "PASS"
